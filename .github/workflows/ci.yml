# Build e testes de todo pull request para a develop.
# O verify roda unitários (Surefire), integração com Testcontainers (Failsafe) e a meta do JaCoCo.
name: CI

on:
  pull_request:
    branches: [develop]

# Um push novo no PR cancela o build anterior do mesmo PR
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build e testes (./mvnw verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 25 com cache do Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # O Docker do runner é usado pelos *IT com Testcontainers
      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
